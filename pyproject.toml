[tool.pytest.ini_options]
# Rootdir-relative import so `from src...` works without sys.path hacks.
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-v --strict-markers"
markers = [
    "network: test requires live network access to NOAA or NASA (deselect with '-m \"not network\"')",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
