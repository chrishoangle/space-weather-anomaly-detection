name: daily-detection

on:
  schedule:
    # 06:15 UTC daily. Deliberately not on the hour: GitHub's shared scheduler
    # is heavily contended at :00 and delays runs by tens of minutes.
    - cron: "15 6 * * *"
  workflow_dispatch:

# Only one run at a time: two concurrent runs would race on the commit below.
concurrency:
  group: daily-detection
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  detect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run detection
        # The script exits 0 for "upstream unavailable" and non-zero only for
        # our own bugs, so a red run here means a real defect, not NOAA having
        # a bad morning. That distinction is what keeps the signal meaningful
        # instead of training us to ignore failures.
        run: python scripts/run_daily_detection.py --hours 72

      - name: Commit the report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/latest.md reports/latest.json
          if git diff --cached --quiet; then
            echo "Report unchanged; nothing to commit."
          else
            git commit -m "chore: daily detection report [skip ci]"
            git push
          fi

      - name: Summarise in the run log
        if: always()
        run: cat reports/latest.md >> "$GITHUB_STEP_SUMMARY" || true
